# Hauptkonfiguration. Zugangsdaten gehören NICHT hierher, sondern in .env.
timezone: Europe/Berlin

schedule:
  tick_seconds: 60                 # Wie oft der Scheduler prüft, welche Quellen fällig sind
  default_poll_interval_seconds: 60
  cycle_timeout_seconds: 240       # Harte Obergrenze pro Durchlauf (Schutz gegen Hänger)
  max_backoff_seconds: 1800        # Maximale Wartezeit nach wiederholten Fehlern

research:
  request_timeout_seconds: 20
  max_retries: 3
  retry_base_delay_seconds: 2
  max_items_per_source: 40         # Schutz gegen überlaufende Feeds
  max_response_bytes: 3000000
  user_agent: "KryptoNewsBot/0.1 (+read-only RSS reader)"

verification:
  max_item_age_hours: 24           # Ältere Meldungen gelten als nicht aktuell
  cluster_window_hours: 48         # Zeitfenster, in dem Meldungen zu einem Ereignis gruppiert werden
  cluster_similarity_threshold: 0.34
  min_independent_sources: 2       # Unabhängige vertrauenswürdige Quellen für VERIFIZIERT ohne Primärquelle
  min_trust_score: 0.6             # Mindestvertrauen einer Quelle, um als Bestätigung zu zählen
  syndication_similarity: 0.75     # Ab dieser Textähnlichkeit gelten zwei Texte als Kopie
  number_tolerance: 0.05           # Erlaubte relative Abweichung gleicher Zahlenangaben
  verify_primary_links: true       # Verlinkte Primärdokumente tatsächlich abrufen und prüfen
  max_link_checks_per_cycle: 15
  pending_reevaluation_hours: 6    # Wie lange unbestätigte Ereignisse neu bewertet werden

relevance:
  min_level_to_publish: MITTEL     # HOCH | MITTEL | NIEDRIG
  publish_partial_only_if: HOCH    # TEILWEISE BESTÄTIGT nur bei dieser Relevanz
  novelty_hours: 6                 # Ereignisse, die länger bekannt sind, verlieren Neuheitswert
  medium_min_score: 4.5            # etwas strenger als Standard (4.0): nur News, die den Markt bewegen können
  medium_requires_direction: true  # MITTEL nur mit klarer Einschätzung (eher positiv/negativ)

publishing:
  max_posts_per_hour: 4
  max_posts_per_day: 24
  min_seconds_between_posts: 240
  high_priority_bypasses_spacing: true   # HOCH darf den Mindestabstand (nicht die Stundengrenze) überspringen
  max_send_attempts: 3
  max_queue_age_hours: 6           # Nicht gesendete Beiträge verfallen danach (keine veralteten News)
  duplicate_lookback_hours: 72
  duplicate_similarity: 0.55
  post_log_file: data/posts.log      # Jeder Beitrag wird hier zusätzlich protokolliert (Testmodus: nur hier)
  disclaimer: "Keine Anlageberatung."
  mark_test_posts: false          # Kein "[TESTMODUS]"-Hinweis in der Gruppe (Wunsch Jakob, 23.10.2026)

monitoring:
  alert_no_successful_research_minutes: 45
  alert_consecutive_failed_cycles: 3
  alert_consecutive_publish_failures: 3
  alert_cooldown_minutes: 120
  health_max_age_minutes: 30       # Docker-Healthcheck schlägt fehl, wenn der letzte Erfolg älter ist
  hosting_cost_usd_per_month: null # Eigene Serverkosten eintragen, sonst "nicht konfiguriert"

llm:
  enabled: auto                    # auto = nur wenn ANTHROPIC_API_KEY gesetzt ist; true | false
  model: claude-opus-5-5
  effort: low                      # Zusammenfassen braucht wenig Denkaufwand
  max_tokens: 4000
  price_input_usd_per_mtok: 4.0    # Preise laut Anbieter, bei Modellwechsel anpassen
  price_output_usd_per_mtok: 20.0
  daily_budget_usd: 2.0            # Danach wird automatisch auf Textvorlagen umgeschaltet
  max_source_chars: 6000
