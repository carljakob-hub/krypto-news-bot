# Markt-Update: alle 4 Stunden Hoch/Tief von Bitcoin, Ethereum & Co. plus Gold
# und die Top 3 Gewinner/Verlierer. Nutzt denselben Bot und dieselbe Gruppe wie der Newsbot.
name: marktupdate

on:
  schedule:
    # Jede Stunde um :35 starten; marktbot/wait_for_hour.py wartet bis zur vollen Stunde und sendet
    # nur zu den Berliner Uhrzeiten in POST_HOURS. So kommt das Update pünktlich (GitHub startet oft verspätet).
    - cron: "35 * * * *"
  workflow_dispatch:      # "Run workflow" zum sofortigen Testen
    inputs:
      command:
        description: "Befehl"
        type: choice
        default: update
        options: [update, announce]

concurrency:
  group: marktupdate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Bis zur vollen Stunde warten
        id: wait
        if: github.event_name == 'schedule'
        env:
          POST_HOURS: "2,6,10,14,18,22"   # Berliner Uhrzeit
        run: |
          rc=0; python3 marktbot/wait_for_hour.py || rc=$?
          if [ "$rc" = 0 ]; then echo "go=1" >> "$GITHUB_OUTPUT"; elif [ "$rc" != 78 ]; then exit "$rc"; fi
      - uses: actions/setup-python@v6
        if: github.event_name != 'schedule' || steps.wait.outputs.go == '1'
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.31"
        if: github.event_name != 'schedule' || steps.wait.outputs.go == '1'
      - run: python marktbot/bot.py
        if: github.event_name != 'schedule' || steps.wait.outputs.go == '1'
        env:
          ANNOUNCE: ${{ github.event.inputs.command == 'announce' && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.MARKT_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MARKT_CHAT_ID || secrets.TELEGRAM_CHAT_ID || '-1004454200462' }}  # CJ Trades
          TELEGRAM_TOPIC_ID: ${{ secrets.MARKT_TOPIC_ID || '54' }}  # Thema Market Update
